<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">ggonny, Web Publisher</title>
  <desc id="desc">공공기관 웹사이트를 만드는 웹 퍼블리셔</desc>
  <style>
    @font-face{font-family:'GgonnyKR';src:url(data:font/woff2;base64,) format('woff2');font-weight:400}
    @font-face{font-family:'GgonnyKR';src:url(data:font/woff2;base64,) format('woff2');font-weight:600}
    .primary{fill:#172033}
    .secondary{fill:#667085}
    .ko{font-family:'GgonnyKR',Pretendard,'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
    .line{stroke:#D7DEE8}
    .accent{fill:#16A6A1}
