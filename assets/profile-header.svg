  <text class="primary" x="65" y="180" font-family="Inter, Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="84" font-weight="750" letter-spacing="-3">ggonny</text>
