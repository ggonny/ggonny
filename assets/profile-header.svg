    <circle cx="62" cy="21" r="5" fill="#A7B4C6"/>
    <path d="M34 82h82M34 108h150M34 134h112M34 160h178" fill="none" class="code" stroke-width="8" stroke-linecap="round"/>
    <path d="M238 81l-19 25 19 25M286 81l19 25-19 25M270 70l-20 72" fill="none" class="accent_line" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
